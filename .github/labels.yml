# .github/labels.yml — <PROYECTO>
# Fuente de verdad de los labels del repo. Ver docs/convencion-nombres-github.md §5
# Formato compatible con EndBug/label-sync y crazy-max/ghaction-github-labeler.

# ── tipo: ────────────────────────────────────────────
- name: "tipo:feature"
  color: "7B61FF"
  description: "Funcionalidad nueva o cambio de comportamiento visible"
- name: "tipo:bug"
  color: "7B61FF"
  description: "Algo no funciona como está definido"
- name: "tipo:task"
  color: "7B61FF"
  description: "Trabajo técnico sin cambio visible"
- name: "tipo:audit"
  color: "7B61FF"
  description: "Hallazgo surgido de una auditoría"
- name: "tipo:docs"
  color: "7B61FF"
  description: "Documentación"

# ── area: ────────────────────────────────────────────
# TODO: una por área del producto; mismos nombres que los scopes de commit (§2).
# Las tres de abajo existen siempre: labeler.yml las usa.
- name: "area:api"
  color: "1D76DB"
  description: "API y lógica de negocio"
- name: "area:infra"
  color: "1D76DB"
  description: "Deploy, base de datos, CI/CD"
- name: "area:docs"
  color: "1D76DB"
  description: "Documentación, ADRs y reglas para agentes"

# ── prioridad: ───────────────────────────────────────
- name: "prioridad:critica"
  color: "B60205"
  description: "Rompe producción o afecta dinero/entradas"
- name: "prioridad:alta"
  color: "D93F0B"
  description: "Bloquea el próximo hito"
- name: "prioridad:media"
  color: "FBCA04"
  description: "Importante pero no bloquea"
- name: "prioridad:baja"
  color: "C5C5C5"
  description: "Mejora deseable, sin fecha"

# ── estado: ──────────────────────────────────────────
- name: "estado:a-triar"
  color: "FEF2C0"
  description: "Falta asignar tipo, área y prioridad"
- name: "estado:necesita-info"
  color: "FEF2C0"
  description: "No se puede avanzar sin más datos"
- name: "estado:bloqueado"
  color: "FEF2C0"
  description: "Depende de otro issue o de un tercero"

# ── especiales ───────────────────────────────────────
- name: "logica-negocio"
  color: "000000"
  description: "Toca una regla de negocio ya definida; requiere revisión del equipo"
- name: "breaking-change"
  color: "000000"
  description: "Rompe compatibilidad"
