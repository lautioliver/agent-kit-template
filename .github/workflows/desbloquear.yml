# .github/workflows/desbloquear.yml — <PROYECTO>
# Cuando se cierra un issue, revisa los issues que bloqueaba. Si alguno ya no tiene
# bloqueantes abiertos, le saca el label estado:bloqueado y deja un comentario.
# Los bloqueos son las dependencias nativas de GitHub ("Blocked by"); ver la skill crear-issue.
name: Desbloquear issues

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  desbloquear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const cerrado = context.payload.issue.number;
            const base = `/repos/${context.repo.owner}/${context.repo.repo}/issues`;
            const { data: bloqueados } = await github.request(`GET ${base}/${cerrado}/dependencies/blocking`);
            for (const issue of bloqueados.filter(i => i.state === 'open')) {
              const { data: bloqueantes } = await github.request(`GET ${base}/${issue.number}/dependencies/blocked_by`);
              const abiertos = bloqueantes.filter(i => i.state === 'open');
              if (abiertos.length > 0) {
                core.info(`#${issue.number} sigue bloqueado por ${abiertos.map(i => '#' + i.number).join(', ')}`);
                continue;
              }
              const tieneLabel = issue.labels.some(l => (l.name ?? l) === 'estado:bloqueado');
              if (tieneLabel) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'estado:bloqueado' });
              }
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Desbloqueado: se cerró #${cerrado} y no quedan bloqueantes abiertos.`,
              });
              core.info(`#${issue.number} desbloqueado`);
            }
