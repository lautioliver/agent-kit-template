# .github/workflows/docs.yml — <PROYECTO>
# La documentación es infraestructura para agentes: también se testea.
# Valida links, rutas mencionadas, ADRs y documentos obligatorios (scripts/agentes/check-docs.py),
# corre shellcheck sobre los scripts, y en los PRs avisa qué docs habría que revisar según docs/mapa-agentes.json.
name: Docs

on:
  pull_request:
  push:
    branches: [<RAMA_BASE>]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar documentación
        run: python3 scripts/agentes/check-docs.py
      - name: Instalar shellcheck 0.11.0
        # Versión fija (la de ubuntu-latest es más vieja y reporta otros códigos que la local).
        # Para subirla: cambiar la versión y el sha256 (está en la release de koalaman/shellcheck).
        run: |
          v=0.11.0; sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o /tmp/sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v$v/shellcheck-v$v.linux.x86_64.tar.xz"
          echo "$sum  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp && sudo install /tmp/shellcheck-v$v/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Shellcheck de los scripts
        run: git ls-files '*.sh' | xargs shellcheck
      - name: Docs a revisar según el mapa (aviso, no bloquea)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          salida=$(python3 scripts/agentes/mapa.py)
          echo "$salida"
          { echo "## Docs y rutas sensibles"; echo; echo "$salida"; } >> "$GITHUB_STEP_SUMMARY"
          if echo "$salida" | grep -q "SIN MODIFICAR"; then
            echo "::warning::Hay docs que el mapa sugiere revisar y el PR no modifica. Ver el resumen del job."
          fi
