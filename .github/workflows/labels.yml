# .github/workflows/labels.yml — <PROYECTO>
# 1) sync:    aplica .github/labels.yml al repo (borra labels que no estén en el archivo).
# 2) labeler: etiqueta PRs según rama y archivos (.github/labeler.yml).
# 3) check:   valida los labels del PR contra docs/convencion-nombres-github.md §5 y, en las ramas
#             de agentes (claude/…), que el cuerpo cierre o referencie un issue (Refs #n, para un PR
#             que no lo cierra, como un diagnóstico) y muestre el rojo de los tests.
name: Labels

on:
  push:
    branches: [<RAMA_BASE>]
    paths: ['.github/labels.yml']
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

jobs:
  sync:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true   # borra bug, enhancement, etc. (convención §5)

  labeler:
    if: github.event_name == 'pull_request_target' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      # No hace checkout del código del PR: seguro con pull_request_target.
      # La config se lee de la rama base, así que los cambios a labeler.yml rigen después del merge.
      - uses: actions/labeler@v5
        with:
          sync-labels: false   # no quita labels puestos a mano (tipo:audit, logica-negocio, etc.)
      # Las ramas de agentes (claude/…) no dicen el tipo: se copia del issue que el PR cierra.
      # Salió de /mejorar-skills en un repo real: las ramas de agentes llegaban sin tipo y el check fallaba.
      - name: Copiar tipo y área del issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: actual } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo, issue_number: pr.number,
            });
            const tiene = p => actual.some(l => l.name.startsWith(p));
            if (tiene('tipo:')) return core.info('El PR ya tiene tipo:.');
            const nums = new Set();
            for (const m of (pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)/gi)) nums.add(Number(m[1]));
            const rama = pr.head.ref.match(/^[a-z]+\/(\d+)-/);
            if (rama) nums.add(Number(rama[1]));
            for (const n of nums) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n }));
              } catch { continue; }
              if (issue.pull_request) continue;
              const nombres = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
              const tipo = nombres.find(l => l.startsWith('tipo:'));
              if (!tipo) continue;
              const copiar = [tipo, ...(tiene('area:') ? [] : nombres.filter(l => l.startsWith('area:')))];
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: copiar });
              core.notice(`Copiado del issue #${n}: ${copiar.join(', ')}`);
              return;
            }
            core.info('No encontré un issue con tipo: (Closes #n o el número en la rama).');

  labels:
    needs: [labeler]
    # always(): corre aunque labeler se haya salteado (labeled/unlabeled/edited).
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            const names = pr.labels.map(l => l.name);
            const count = p => names.filter(n => n.startsWith(p)).length;
            const errors = [];
            if (count('tipo:') !== 1)    errors.push(`tipo: debe haber exactamente 1 (hay ${count('tipo:')}). Ramas claude/, cursor/ y release/ lo llevan a mano.`);
            if (count('prioridad:') > 0) errors.push('prioridad: no se usa en PRs (solo en issues).');
            if (count('estado:') > 1)    errors.push(`estado: máximo 1 (hay ${count('estado:')}).`);
            if (count('area:') === 0)    core.warning('Ningún area: detectado. Si el PR toca producto, ponelo a mano.');
            if (count('area:') > 2)      core.warning(`${count('area:')} labels area: (la convención pide 1–2). Revisá si conviene dividir el PR.`);
            if (names.includes('logica-negocio')) {
              core.notice('logica-negocio: requiere revisión de todo el equipo y la sección "Lógica de negocio afectada" completa.');
              // Si cambia una regla definida, el ADR que la define se enmienda en el mismo PR.
              // Excepción explícita: una línea "ADR sin cambios: <motivo>" en el cuerpo.
              const archivos = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
              });
              const tocaAdr = archivos.some(f => f.filename.startsWith('docs/decisions/'));
              const explica = /ADR sin cambios:\s*\S/i.test(pr.body || '');
              if (!tocaAdr && !explica) errors.push('logica-negocio sin cambios en docs/decisions/: enmendá el ADR que define la regla, o agregá al cuerpo "ADR sin cambios: <motivo>".');
            }
            // Ramas de agentes: lo que implement-issue pide en el cuerpo, validado acá en vez de en la skill.
            if (/^claude\//.test(pr.head.ref)) {
              // Sin los comentarios <!-- … --> de la plantilla: mencionan "Rojo antes de implementar" y "sin test".
              const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
              // Refs #n, en su propia línea: el PR es parte del issue pero no lo cierra (un diagnóstico,
              // un paso de varios). Un "ref #38" de pasada en el texto no cuenta.
              const cierra = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#\d+/i;
              const refiere = /^\s*refs?:?\s+#\d+/im;
              if (!cierra.test(body) && !refiere.test(body))
                errors.push('el cuerpo no cierra ni referencia ningún issue: agregá "Closes #<n>" (o "Refs #<n>" si no lo cierra).');
              if (!/<summary>Rojo antes de implementar<\/summary>|sin test\b.*\S/i.test(body))
                errors.push('falta en "Cómo probarlo" el bloque "Rojo antes de implementar" de rojo.sh (o "sin test" con el motivo).');
            }
            if (errors.length) core.setFailed('PR fuera de convención:\n- ' + errors.join('\n- '));
            else core.info('PR OK. Labels: ' + names.join(', '));
