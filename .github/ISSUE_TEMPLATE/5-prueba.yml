name: Reporte de prueba
description: Probaste la plantilla en tu repo y querés contar dónde te trabaste
labels: ["estado:a-triar"]
body:
  - type: markdown
    attributes:
      value: "Gracias por probarla. La guía está en `docs/probar-la-plantilla.md`. No pegues secretos ni datos personales."
  - type: dropdown
    id: herramienta
    attributes:
      label: Herramienta
      options: [Claude Code, Codex, GitHub Copilot, Cursor, Otra]
    validations: { required: true }
  - type: dropdown
    id: modo
    attributes:
      label: Modo
      options: [Completo, Chico, No llegué a inicializar]
    validations: { required: true }
  - type: dropdown
    id: hasta
    attributes:
      label: Hasta dónde llegaste
      description: El último paso de la guía que terminaste.
      options:
        - 1. Crear el repo
        - 2. Inicializar
        - 3. Completar lo mínimo
        - 4. Labels y equipo
        - 5. Un issue desde el chat
        - 6. Del issue al PR
        - 7. Revisión
        - 8. Merge
        - 9. Orquestar u otra herramienta
    validations: { required: true }
  - type: textarea
    id: trabas
    attributes:
      label: Dónde te trabaste
      description: Un ítem por traba, con el paso, qué hiciste y el error textual.
      value: "- Paso N: "
    validations: { required: true }
  - type: textarea
    id: dudas
    attributes:
      label: Qué leíste dos veces o no entendiste
  - type: textarea
    id: agente
    attributes:
      label: Qué hizo el agente que no esperabas
      description: Se frenó, preguntó de más, se salteó algo, tocó lo que no debía, o lo hiciste vos a mano.
  - type: input
    id: tiempo
    attributes:
      label: Tiempo hasta el primer PR
      placeholder: "por ejemplo: 50 minutos"
  - type: textarea
    id: cambiaria
    attributes:
      label: ¿La volverías a usar? ¿Qué cambiarías primero?
